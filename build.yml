name: Build APKs
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: trim, name: "قص وتغيير المقاس"}
          - {app: analyze, name: "تحليل الإثارة"}
          - {app: captions, name: "محرر النصوص"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Build
        run: |
          mkdir -p build/www build/assets
          cp ${{ matrix.app }}.html build/www/index.html
          cp ${{ matrix.app }}.png build/assets/icon-only.png
          cp ${{ matrix.app }}-splash.png build/assets/splash.png
          cp ${{ matrix.app }}-splash.png build/assets/splash-dark.png
          cd build
          echo '{"name":"app","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/android":"^6.2.0","@capacitor/filesystem":"^6.0.0","@capacitor/share":"^6.0.0"},"devDependencies":{"@capacitor/cli":"^6.2.0","@capacitor/assets":"^3.0.5"}}' > package.json
          echo '{"appId":"com.shorts.${{ matrix.app }}","appName":"${{ matrix.name }}","webDir":"www","backgroundColor":"#07090d"}' > capacitor.config.json
          npm install
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
